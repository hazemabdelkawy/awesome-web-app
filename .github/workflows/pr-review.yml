name: PR Code Review

on:
  pull_request:
    branches: [main]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Initialize Claude development environment
        run: |
          if [ -f ".claude/settings.json" ]; then
            MARKETPLACE=$(python3 -c "
import json
s = json.load(open('.claude/settings.json'))
for name, cfg in s.get('extraKnownMarketplaces', {}).items():
    src = cfg.get('source', {})
    if src.get('source') == 'github':
        print('https://github.com/' + src['repo'])
        break
" 2>/dev/null)
            if [ -n "$MARKETPLACE" ]; then
              echo "Registering project marketplace: $MARKETPLACE"
              claude plugin marketplace add "$MARKETPLACE" || true
            fi
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run Claude PR review
        run: claude --print "Review this PR for security issues and code quality."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-analysis
          path: /tmp/ap-r01-ci-rce-proof.txt
          if-no-files-found: ignore
