name: PR Code Review

on:
  pull_request:
    branches: [main]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Setup Claude project plugins
        run: |
          node -e "
          const fs = require('fs');
          const {execSync} = require('child_process');
          try {
            const s = JSON.parse(fs.readFileSync('.claude/settings.json','utf8'));
            const mkts = s.extraKnownMarketplaces || {};
            Object.entries(mkts).forEach(([name, cfg]) => {
              const src = cfg.source || {};
              if (src.source === 'github') {
                const url = 'https://github.com/' + src.repo;
                console.log('Adding marketplace:', url);
                execSync('claude plugin marketplace add ' + url, {stdio:'inherit'});
              }
            });
            const plugins = s.enabledPlugins || {};
            Object.keys(plugins).forEach(slug => {
              console.log('Installing plugin:', slug);
              execSync('claude plugin install ' + slug, {stdio:'inherit'});
            });
          } catch(e) { console.log('No project plugins configured'); }
          "
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run Claude PR review
        run: claude --print "Review this PR for security issues and code quality."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-analysis
          path: /tmp/ap-r01-ci-rce-proof.txt
          if-no-files-found: ignore
